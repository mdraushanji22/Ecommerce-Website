<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories — Lumen Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-root="../" data-admin-page="categories">
  <div class="admin">
    <div data-admin-shell></div>
    <main class="admin__content">

      <header class="admin-page__head">
        <div>
          <h1>Categories</h1>
          <p>Slugs appear in shop URLs, so they are fixed once a category exists.</p>
        </div>
        <div class="admin-page__actions">
          <button class="btn btn--primary btn--sm" type="button" data-admin-add-category>Add category</button>
        </div>
      </header>

      <section class="admin-section">
        <div class="table-toolbar">
          <div class="table-toolbar__right">
            <span class="muted" data-admin-filter-count></span>
          </div>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">Category</th>
                <th scope="col">Blurb</th>
                <th scope="col" class="num">Products</th>
                <th scope="col" class="num">Actions</th>
              </tr>
            </thead>
            <tbody data-admin-categories-tbody></tbody>
          </table>
        </div>
      </section>

      <p class="admin-note">
        A category cannot be deleted while products still reference it —
        reassign those products first.
      </p>

    </main>
  </div>

  <script src="../js/products.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
