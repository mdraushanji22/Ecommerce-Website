<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Halo Pro Studio over-ear headphones, floating">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FBFBFD"/>
      <stop offset="0.55" stop-color="#EFEFF4"/>
      <stop offset="1" stop-color="#E2E2EA"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#C9A87A"/>
      <stop offset="0.38" stop-color="#F6E6CB"/>
      <stop offset="0.68" stop-color="#B2915F"/>
      <stop offset="1" stop-color="#E4D2B2"/>
    </linearGradient>
    <linearGradient id="cup" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F3E3C8"/>
      <stop offset="0.32" stop-color="#D8BE94"/>
      <stop offset="0.68" stop-color="#A4875E"/>
      <stop offset="1" stop-color="#DCC79E"/>
    </linearGradient>
    <radialGradient id="pad" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#544C42"/>
      <stop offset="0.55" stop-color="#2A2521"/>
      <stop offset="1" stop-color="#15120F"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDEFF3"/>
      <stop offset="0.5" stop-color="#A9AEBA"/>
      <stop offset="1" stop-color="#E4E7EC"/>
    </linearGradient>
    <filter id="blurLg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="34" stdDeviation="40" flood-color="#3A2C15" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="400" rx="470" ry="400" fill="url(#halo)"/>

  <circle cx="238" cy="196" r="120" fill="#0071E3" opacity="0.07" filter="url(#blurLg)"/>
  <circle cx="990" cy="700" r="150" fill="#6D5BD0" opacity="0.08" filter="url(#blurLg)"/>

  <ellipse cx="600" cy="792" rx="290" ry="34" fill="#3A2C15" opacity="0.12" filter="url(#blurLg)"/>

  <g filter="url(#shadow)">
    <path d="M340 528 C 340 158, 860 158, 860 528" fill="none" stroke="url(#band)" stroke-width="62" stroke-linecap="round"/>
    <path d="M372 486 C 372 214, 828 214, 828 486" fill="none" stroke="#6B5A44" stroke-opacity="0.4" stroke-width="22" stroke-linecap="round"/>

    <g>
      <rect x="252" y="536" width="26" height="76" rx="10" fill="url(#metal)"/>
      <ellipse cx="318" cy="628" rx="126" ry="158" fill="url(#cup)"/>
      <ellipse cx="318" cy="628" rx="94" ry="124" fill="url(#pad)"/>
      <ellipse cx="318" cy="628" rx="94" ry="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
      <ellipse cx="318" cy="628" rx="48" ry="66" fill="#241F1B" opacity="0.8"/>
      <ellipse cx="286" cy="586" rx="44" ry="26" fill="#FFFFFF" opacity="0.14" transform="rotate(-30 286 586)"/>
    </g>

    <g>
      <rect x="922" y="536" width="26" height="76" rx="10" fill="url(#metal)"/>
      <ellipse cx="882" cy="628" rx="126" ry="158" fill="url(#cup)"/>
      <ellipse cx="882" cy="628" rx="94" ry="124" fill="url(#pad)"/>
      <ellipse cx="882" cy="628" rx="94" ry="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
      <ellipse cx="882" cy="628" rx="48" ry="66" fill="#241F1B" opacity="0.8"/>
      <ellipse cx="850" cy="586" rx="44" ry="26" fill="#FFFFFF" opacity="0.14" transform="rotate(-30 850 586)"/>
    </g>
  </g>

  <g opacity="0.5">
    <circle cx="176" cy="620" r="6" fill="#0071E3"/>
    <circle cx="1030" cy="252" r="5" fill="#1D1D1F" opacity="0.25"/>
    <circle cx="1090" cy="470" r="7" fill="#34C759" opacity="0.35"/>
  </g>
</svg>
