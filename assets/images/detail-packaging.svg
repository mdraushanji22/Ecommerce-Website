<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Retail packaging and box contents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAFB"/>
      <stop offset="1" stop-color="#E8E8ED"/>
    </linearGradient>
    <linearGradient id="box" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F0F0F3"/>
      <stop offset="1" stop-color="#D0D1D7"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8D9DE"/>
      <stop offset="1" stop-color="#B2B4BB"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1D1D1F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="340" r="260" fill="#FFFFFF" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="400" cy="632" rx="290" ry="26" fill="#1D1D1F" opacity="0.13" filter="url(#soft)"/>

  <g filter="url(#lift)">
    <path d="M182 340 L400 250 L618 340 L400 430 Z" fill="url(#box)"/>
    <path d="M182 340 L400 430 L400 622 L182 532 Z" fill="url(#boxSide)"/>
    <path d="M618 340 L400 430 L400 622 L618 532 Z" fill="url(#box)"/>
    <path d="M182 340 L400 430 L618 340" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M400 250 L400 430" fill="none" stroke="#C8C9CF" stroke-width="2"/>
    <rect x="182" y="300" width="146" height="42" rx="8" fill="#0071E3" opacity="0.9"/>
    <text x="255" y="328" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="3">LUMEN</text>
    <rect x="500" y="352" width="86" height="8" rx="4" fill="#1D1D1F" opacity="0.2"/>
    <rect x="500" y="372" width="56" height="8" rx="4" fill="#1D1D1F" opacity="0.12"/>
  </g>
</svg>
