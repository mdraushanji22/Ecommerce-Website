<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Product shown from three angles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFCFD"/>
      <stop offset="1" stop-color="#EAEAEF"/>
    </linearGradient>
    <linearGradient id="face" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#EFF0F3"/>
      <stop offset="0.5" stop-color="#C0C3CB"/>
      <stop offset="1" stop-color="#8E939E"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A6AAB4"/>
      <stop offset="1" stop-color="#6E737E"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1D1D1F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="340" r="260" fill="#FFFFFF" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="400" cy="620" rx="280" ry="26" fill="#1D1D1F" opacity="0.12" filter="url(#soft)"/>

  <g filter="url(#lift)">
    <g transform="translate(150 320) scale(0.72)">
      <rect x="0" y="0" width="220" height="300" rx="36" fill="url(#face)"/>
      <rect x="220" y="24" width="46" height="252" rx="18" fill="url(#side)"/>
      <rect x="24" y="26" width="172" height="248" rx="22" fill="#FFFFFF" opacity="0.25"/>
    </g>

    <g transform="translate(330 190)">
      <rect x="0" y="0" width="240" height="360" rx="42" fill="url(#face)"/>
      <rect x="30" y="34" width="180" height="292" rx="26" fill="#1C2432" opacity="0.85"/>
      <rect x="48" y="70" width="144" height="10" rx="5" fill="#FFFFFF" opacity="0.4"/>
      <rect x="48" y="96" width="96" height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
      <circle cx="120" cy="216" r="52" fill="#0071E3" opacity="0.35"/>
    </g>

    <g transform="translate(560 340) scale(0.6)">
      <rect x="0" y="0" width="200" height="320" rx="34" fill="url(#face)"/>
      <rect x="0" y="150" width="200" height="170" rx="34" fill="url(#side)" opacity="0.6"/>
    </g>
  </g>
</svg>
