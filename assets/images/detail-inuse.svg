<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Product in a real lifestyle setting">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F4F4F7"/>
      <stop offset="1" stop-color="#E3E3EA"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8CFC4"/>
      <stop offset="1" stop-color="#B7AB9C"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFB35C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F0F1F5"/>
      <stop offset="0.5" stop-color="#C2C5CE"/>
      <stop offset="1" stop-color="#9196A1"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#4A3A28" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#wall)"/>
  <rect y="520" width="800" height="280" fill="url(#desk)"/>
  <rect y="520" width="800" height="6" fill="#FFFFFF" opacity="0.35"/>

  <circle cx="180" cy="180" r="220" fill="url(#glow1)" filter="url(#soft)"/>
  <circle cx="680" cy="300" r="180" fill="#9BB4E8" opacity="0.18" filter="url(#soft)"/>

  <g opacity="0.5">
    <rect x="96" y="200" width="180" height="240" rx="8" fill="#FFFFFF" opacity="0.55"/>
    <rect x="116" y="226" width="140" height="10" rx="5" fill="#1D1D1F" opacity="0.16"/>
    <rect x="116" y="252" width="96" height="10" rx="5" fill="#1D1D1F" opacity="0.1"/>
    <rect x="116" y="290" width="140" height="120" rx="6" fill="#1D1D1F" opacity="0.08"/>
  </g>

  <g filter="url(#lift)">
    <rect x="452" y="352" width="230" height="176" rx="26" fill="url(#body)"/>
    <rect x="472" y="376" width="190" height="112" rx="14" fill="#1B2434" opacity="0.88"/>
    <rect x="492" y="404" width="120" height="9" rx="4" fill="#FFFFFF" opacity="0.4"/>
    <rect x="492" y="426" width="76" height="9" rx="4" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="576" cy="470" r="14" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <ellipse cx="566" cy="530" rx="130" ry="16" fill="#4A3A28" opacity="0.16"/>
</svg>
