<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your wishlist — Lumen</title>
  <meta name="description" content="Everything you have saved on Lumen, kept on this device so you can compare and buy later.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page" data-page="wishlist">
  <a class="skip-link" href="#main">Skip to content</a>

  <div data-slot="header"></div>

  <main class="page__main" id="main">
    <div class="container">

      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-current="page">Wishlist</span>
      </nav>

      <header class="page-head">
        <h1>Your wishlist</h1>
        <p data-wishlist-count-label>Nothing saved yet</p>
      </header>

      <div class="row row--between row--wrap gap-3 mb-6" data-wishlist-toolbar>
        <p class="muted wishlist__note">
          Saved on this device. Sign in to keep a wishlist across browsers.
        </p>
        <a class="btn btn--outline btn--sm" href="shop.html">Continue shopping</a>
      </div>

      <div data-wishlist-root></div>

    </div>
  </main>

  <div data-slot="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
